name: Build and HTTP tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build UsersApi.sln --configuration Release
      - run: dotnet run --project tests/UsersApi.SmokeTests --configuration Release --no-build -- .
